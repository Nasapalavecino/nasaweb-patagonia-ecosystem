name: Nasaweb Swarm Daily Automation

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 8 * * *' # Ejecución automática diaria opcional a las 08:00 UTC

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar motor del Swarm de Agentes
        run: python swarm_master.py
