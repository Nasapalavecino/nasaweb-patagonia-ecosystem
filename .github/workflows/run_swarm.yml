name: Nasaweb Swarm Daily Automation

on:
  workflow_dispatch:

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias multimedia y de red
        run: |
          python -m pip install --upgrade pip
          pip install requests moviepy

      - name: Ejecutar motor del Swarm de Agentes
        run: python swarm_master.pyarm de Agentes
        run: python swarm_master.py
